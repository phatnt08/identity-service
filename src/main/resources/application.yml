spring:
  application:
    name: identity-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/identity-service} # Default value if DB_URL is not set
    username: ${DB_USERNAME:root} # Default value if DB_USERNAME is not set
    password: ${DB_PASSWORD:root} # Default value if DB_PASSWORD is not set
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: ${SERVER_PORT:8081} # Default value if SERVER_PORT is not set
  servlet:
    context-path: /identity

jwt:
  signer-key: ${JWT_SIGNER_KEY:HQ8N2AYzoBFfkaMGafXxQidH2sGZb9QIE4BlRruZ1/2CYtTWOlDMI8cYRw6++ANm} # Default value if JWT_SIGNER_KEY is not set
  expiry-time: ${JWT_EXPIRATION:3600000} # Default value if JWT_EXPIRATION is not set (1 hour)
  refresh-time: ${JWT_REFRESH_EXPIRATION:86400000} # Default value if JWT_REFRESH_EXPIRATION is not set (1 day)

app:
  services:
    profile: ${PROFILE_SERVICE_URL:http://localhost:8082/profile}